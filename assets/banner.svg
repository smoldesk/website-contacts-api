<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0A1F5C"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B2A7A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="260" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="1060" cy="620" r="200" fill="#FFFFFF" opacity="0.04"/>

  <!-- logo mark -->
  <g transform="translate(96,170) scale(0.6)">
    <rect width="500" height="500" rx="110" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"/>
    <rect x="82" y="112" width="336" height="276" rx="30" fill="#FFFFFF"/>
    <path d="M82 142a30 30 0 0 1 30-30h276a30 30 0 0 1 30 30v26H82z" fill="#DCE6FB"/>
    <circle cx="116" cy="140" r="9" fill="#2563EB"/>

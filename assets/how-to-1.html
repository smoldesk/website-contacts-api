<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root { --bg:#0A1430; --panel:#111D40; --line:#24345F; --text:#E7EDFB; --muted:#93A3C9; --blue:#3B82F6; --green:#22C55E; --amber:#FBBF24; --pink:#F472B6; }
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1200px; height:675px; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased;
  background-image: radial-gradient(rgba(147,163,201,.16) 1.2px, transparent 1.2px); background-size: 26px 26px; }
.wrap { position:absolute; inset:0; padding:56px 72px; display:grid; grid-template-columns: 380px 1fr; gap:56px; align-items:center; }
.glow { position:absolute; width:620px; height:620px; right:-160px; top:-200px; border-radius:50%; background:radial-gradient(circle, rgba(59,130,246,.28), transparent 65%); }
.tag { display:inline-flex; align-items:center; gap:10px; font-family:"JetBrains Mono"; font-size:17px; font-weight:700; letter-spacing:.08em;
  color:var(--green); border:1.5px solid rgba(34,197,94,.55); border-radius:999px; padding:7px 16px; background:rgba(34,197,94,.08); }
.tag i { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green); }
h1 { font-family:"Space Grotesk"; font-size:54px; line-height:1.02; font-weight:700; letter-spacing:-.02em; margin:26px 0 18px; }
p.sub { font-size:21px; line-height:1.5; color:var(--muted); }
p.sub b { color:var(--text); font-weight:600; }
.panel { position:relative; background:var(--panel); border:1.5px solid var(--line); border-radius:20px; overflow:hidden; box-shadow: 0 30px 70px rgba(0,0,0,.45); }
.bar { height:46px; display:flex; align-items:center; gap:9px; padding:0 18px; border-bottom:1.5px solid var(--line); background:rgba(255,255,255,.02); }
.bar i { width:12px; height:12px; border-radius:50%; background:#2A3A68; }
.bar span { margin-left:12px; font-family:"JetBrains Mono"; font-size:14px; color:var(--muted); }
.body { padding:26px 28px; }
.mono { font-family:"JetBrains Mono"; }
/* plans */
.plan { display:grid; grid-template-columns: 1fr 120px 92px; align-items:center; padding:15px 4px; border-bottom:1px solid var(--line); font-size:21px; }
.plan:last-child { border-bottom:none; }
.plan b { font-family:"Space Grotesk"; font-size:23px; font-weight:600; }
.plan .q { font-family:"JetBrains Mono"; font-size:16px; color:var(--muted); }
.plan .pr { font-family:"JetBrains Mono"; font-size:20px; text-align:right; }
.plan.sel { background:rgba(59,130,246,.12); border-radius:12px; border-bottom-color:transparent; padding-left:14px; padding-right:14px; margin:0 -10px; }
.chip { font-family:"JetBrains Mono"; font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--bg); background:var(--green); border-radius:6px; padding:2px 7px; margin-left:10px; vertical-align:3px; }
/* request */
.req { font-family:"JetBrains Mono"; font-size:19px; line-height:1.75; }
.req .m { color:var(--green); font-weight:700; } .req .u { color:var(--text); } .req .k { color:var(--blue); } .req .v { color:var(--amber); } .req .c { color:#5D6E99; }
.send { display:inline-flex; align-items:center; gap:12px; margin-top:22px; background:var(--blue); color:#fff; font-family:"Space Grotesk"; font-weight:600; font-size:22px; border-radius:12px; padding:13px 26px; }
/* json */
pre { font-family:"JetBrains Mono"; font-size:17.5px; line-height:1.62; color:var(--text); white-space:pre; }
pre .k { color:#8AB4FF; } pre .s { color:#A7F3C8; } pre .n { color:var(--amber); } pre .p { color:#5D6E99; } pre .g { color:var(--green); font-weight:700; }
.badge { position:absolute; right:22px; top:62px; font-family:"JetBrains Mono"; font-size:14px; color:var(--green); border:1.5px solid rgba(34,197,94,.55); border-radius:8px; padding:4px 10px; background:rgba(34,197,94,.08); }
/* sheet */
.fx { display:flex; gap:14px; align-items:center; font-family:"JetBrains Mono"; font-size:20px; padding:12px 16px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:18px; }
.fx i { color:#5D6E99; font-style:italic; } .fx b { color:var(--amber); font-weight:700; }
table { width:100%; border-collapse:collapse; }
th { font-family:"JetBrains Mono"; font-size:13.5px; font-weight:500; color:var(--muted); text-align:left; padding:10px 8px; border-bottom:1.5px solid var(--line); }
td { font-size:15.5px; padding:13px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
td.m { font-family:"JetBrains Mono"; font-size:13.5px; }
tr.hit td { background:rgba(34,197,94,.08); }
</style></head><body><div class="glow"></div><div class="wrap"><div><span class="tag"><i></i>STEP 1</span><h1>Pick a plan</h1><p class="sub">Start free on <b>RapidAPI</b>. You only pay for websites where contacts are found.</p></div><div class="panel"><div class="bar"><i></i><i></i><i></i><span>rapidapi.com / pricing</span></div><div class="body">
<div class="plan sel"><b>BASIC</b><span class="q">50 / mo</span><span class="pr">$0</span></div>
<div class="plan"><b>PRO</b><span class="q">10,000 / mo</span><span class="pr">$15</span></div>
<div class="plan"><b>ULTRA<span class="chip">BEST</span></b><span class="q">40,000 / mo</span><span class="pr">$45</span></div>
<div class="plan"><b>MEGA</b><span class="q">160,000 / mo</span><span class="pr">$135</span></div></div></div></div></body></html>
